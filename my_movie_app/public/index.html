<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 영화 추천 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">MovieAI</a>
            <ul class="nav-menu">
                <li><a href="#">홈</a></li>
                <li><a href="#">추천 받기</a></li>
                <li><a href="#">보관함</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">당신의 취향을 저격할 영화를 찾아보세요</h1>
            <p class="hero-subtitle">원하는 분위기나 키워드를 입력하면 AI가 영화를 추천해 드립니다.</p>
            
            <div class="search-box">
                <input type="text" id="keyword-input" placeholder="예: 우주에서 벌어지는 외로운 싸움, 잔잔한 로맨스">
                <button type="button" id="search-btn">추천받기</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="recommendation-section">
            <h2 class="section-title">AI 추천 결과</h2>
            
            <div id="recommendation-list" class="movie-list">
                <div style="text-align: center; padding: 40px; color: #7F8C8D;">
                    <p>상단 검색창에 키워드를 입력하고 버튼을 눌러보세요! 🚀</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
